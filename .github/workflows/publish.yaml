on: pull_request

env:
  GG_GITHUB_TOKEN: ${{ github.token }}

permissions:
  id-token: write # for vsce trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: ./pnpm.cmd install

      - name: add npm scripts to PATH
        run: echo ./node_modules/.bin >> $GITHUB_PATH

      # https://marketplace.visualstudio.com/manage/publishers/detachhead/trustedpublishing
      # - name: publish VSIX - visual studio marketplace
      #   run: vsce publish --oidc --allow-star-activation --no-dependencies --pre-release

      - name: publish VSIX - open VSX
        # https://github.com/eclipse-openvsx/openvsx/issues/2423
        run: yes | ovsx publish --no-dependencies --pre-release

